# Foundation only; PostgreSQL is NOT connected by the MVP.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deskaone_control}
      POSTGRES_USER: ${POSTGRES_USER:-deskaone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
volumes:
  postgres_data:
